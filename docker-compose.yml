version: '3.8'

services:
    app:
        build:
            context: .
            dockerfile: docker/Dockerfile
        working_dir: /var/www/html
        volumes:
            - .:/var/www/html
        environment:
            - DB_HOST=mysql
            - REDIS_HOST=redis
        depends_on:
            - mysql
            - redis
        networks:
            - whatsflow

    nginx:
        image: nginx:1.27-alpine
        ports:
            - '8000:80'
        volumes:
            - .:/var/www/html
            - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
        depends_on:
            - app
        networks:
            - whatsflow

    mysql:
        image: mysql:8.4
        environment:
            MYSQL_DATABASE: whats_v1
            MYSQL_ROOT_PASSWORD: secret
        ports:
            - '33061:3306'
        volumes:
            - mysql-data:/var/lib/mysql
        networks:
            - whatsflow

    redis:
        image: redis:7-alpine
        ports:
            - '63791:6379'
        networks:
            - whatsflow

    horizon:
        build:
            context: .
            dockerfile: docker/Dockerfile
        command: php artisan horizon
        volumes:
            - .:/var/www/html
        environment:
            - DB_HOST=mysql
            - REDIS_HOST=redis
        depends_on:
            - mysql
            - redis
        networks:
            - whatsflow

    reverb:
        build:
            context: .
            dockerfile: docker/Dockerfile
        command: php artisan reverb:start --host=0.0.0.0 --port=8080
        ports:
            - '8080:8080'
        volumes:
            - .:/var/www/html
        environment:
            - DB_HOST=mysql
            - REDIS_HOST=redis
        depends_on:
            - mysql
            - redis
        networks:
            - whatsflow

    scheduler:
        build:
            context: .
            dockerfile: docker/Dockerfile
        command: php artisan schedule:work
        volumes:
            - .:/var/www/html
        environment:
            - DB_HOST=mysql
            - REDIS_HOST=redis
        depends_on:
            - mysql
            - redis
        networks:
            - whatsflow

volumes:
    mysql-data:

networks:
    whatsflow:
        driver: bridge
