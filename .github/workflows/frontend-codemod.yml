name: Frontend warning codemod

on:
  push:
    branches:
      - fix/frontend-react-warnings-20260810

permissions:
  contents: write

jobs:
  codemod:
    if: ${{ !contains(github.event.head_commit.message, 'Apply React warning codemod') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/frontend-react-warnings-20260810

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci --ignore-scripts
      - run: node scripts/fix-react-warnings.mjs
      - run: npm run lint -- --max-warnings=0
      - run: npm run typecheck

      - name: Commit transformed sources
        run: |
          if git diff --quiet -- resources/js; then
            echo 'No source changes produced.'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add resources/js
          git commit -m 'Apply React warning codemod'
          git push origin HEAD:fix/frontend-react-warnings-20260810
